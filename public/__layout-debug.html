<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>layout debug</title>
<link rel="stylesheet" href="/__debug.css" />
<style>html,body,#root{margin:0;height:100%}</style>
</head>
<body>
<div id="root">
  <div class="font-app hy-messenger flex h-dvh overflow-hidden messenger-modern bg-gradient-to-br from-[#fbfbfa] via-[#f7f7f4] to-accent-soft/25">
    <div class="hy-backdrop hy-shell-backdrop fixed"></div>
    <button class="hy-melody is-playing"><span class="hy-melody-badge">V</span><span class="hy-melody-eq"><i></i><i></i><i></i><i></i></span><span class="hy-melody-text">Фоновая музыка</span></button>
    <div class="winchat-page-transition you-front h-full w-full md:w-[424px] md:shrink-0">
      <aside class="modern-sidebar relative flex h-full w-full overflow-hidden border-black/8 bg-white md:border-r">
        <svg class="hy-garland hy-sidebar-garland" viewBox="0 0 896 104" width="100%" height="104" preserveAspectRatio="none"><path d="M 0 8 Q 28 48 56 8" fill="none" stroke="#2e7d32" stroke-width="3"/></svg>
        <div class="modern-rail hidden w-[78px] shrink-0 flex-col items-center px-2 py-4 md:flex">
          <button class="mb-3 flex h-11 w-11 items-center justify-center overflow-hidden rounded-[16px] bg-white shadow-md ring-1 ring-black/5">C</button>
          <div class="flex flex-1 flex-col items-center gap-1.5">
            <button class="modern-rail-btn is-active">1</button>
            <button class="modern-rail-btn">2</button>
            <button class="modern-rail-btn">3</button>
          </div>
          <div class="flex flex-col items-center gap-1.5"><button class="modern-rail-btn">S</button></div>
        </div>
        <div class="flex min-w-0 flex-1 flex-col">
          <div class="hy-phone-head relative z-10 px-3 pb-3 md:hidden"><p>phone head</p></div>
          <div class="px-4 pt-4 pb-2"><h1>Чаты</h1><p>10 диалогов</p></div>
          <div class="flex-1 overflow-y-auto px-2">
            <div class="modern-chat-row rounded-2xl px-3 py-3">Чат 1</div>
            <div class="modern-chat-row rounded-2xl px-3 py-3">Чат 2</div>
            <div class="modern-chat-row rounded-2xl px-3 py-3">Чат 3</div>
          </div>
          <div class="hidden border-t border-black/6 px-3 py-3 md:block"><div class="modern-chat-row rounded-2xl px-2.5 py-2">Профиль</div></div>
        </div>
      </aside>
    </div>
    <main class="winchat-page-transition you-front min-w-0 flex-1"><div style="padding:20px">main</div></main>
  </div>
</div>
</body>
</html>
