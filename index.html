<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f9ff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=Manrope:wght@400;500;600;700;800&family=Marck+Script&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <title>WinChat</title>
    <!--
      Статичная заглушка до загрузки бандла.
      На телефонах приложение весит несколько мегабайт, и без неё
      WebView успевает показать белый экран — выглядит как «не грузится».
    -->
    <script>
      // Учитываем сохранённую тему ещё до загрузки React, без белой вспышки.
      try {
        if (localStorage.getItem("winchat_ny_dark") === "on") document.documentElement.classList.add("ny-dark");
      } catch (_) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #f6f9ff;
      }
      #boot-static {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #fff 0%, #f4f4f3 100%);
        font-family: "WinChat Zusker", Roboto, ui-sans-serif, system-ui, sans-serif;
      }
      html.ny-dark, html.ny-dark body { background: #0b0c0e; }
      html.ny-dark #boot-static {
        background: radial-gradient(circle at 50% 45%, #202124 0%, #0b0c0e 100%);
      }
      html.ny-dark #boot-static i { background: #111214; box-shadow: 0 26px 60px -34px #000; }
      html.ny-dark #boot-static span { color: #fff; }
      #boot-static i {
        display: grid;
        place-items: center;
        width: 108px;
        height: 108px;
        border-radius: 38%;
        background: #fff;
        box-shadow: 0 26px 60px -34px rgba(0, 0, 0, 0.32);
        animation: boot-static-pulse 1.8s ease-in-out infinite;
      }
      #boot-static span {
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -4px;
        line-height: 1;
        color: #111;
      }
      @keyframes boot-static-pulse {
        50% {
          transform: scale(1.045);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-static i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-static" aria-hidden="true"><i><span>W</span></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
