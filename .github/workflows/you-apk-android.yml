# ============================================================
#  WinChat You — GitHub Actions: сборка APK из папки you/
#  Версия: 6.0.2
#  Пакет: com.winchat.you
# ============================================================

name: Build WinChat You APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: you

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      VITE_APP_VARIANT: you
      KEYSTORE_FILE: ${{ github.workspace }}/you/keystore.jks
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: you/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── Android SDK + лицензии ──
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Sync Capacitor Android
        run: npx cap sync android

      # ── Декодируем keystore из секрета (в you/keystore.jks) ──
      - name: Decode keystore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks
            echo "KEYSTORE_SAVED=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_SAVED=false" >> $GITHUB_ENV
            echo "::warning::ANDROID_KEYSTORE secret is not set — release APK will NOT be built"
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── Release-сборка с подписью ──
      - name: Build release APK (signed)
        if: env.KEYSTORE_SAVED == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: winchat-you-debug-apk
          path: you/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        if: env.KEYSTORE_SAVED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: winchat-you-release-apk
          path: you/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_SAVED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: you-v${{ steps.ver.outputs.version }}
          name: WinChat You v${{ steps.ver.outputs.version }}
          files: you/android/app/build/outputs/apk/release/app-release.apk
          make_latest: false
          body: |
            **WinChat You v${{ steps.ver.outputs.version }}**

            Android 8+ | com.winchat.you
            Подписанный APK

            Отдельное приложение только с темой WinChat You (Material You).
            Та же иконка, что у WinChat.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
